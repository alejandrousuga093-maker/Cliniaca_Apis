<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medik | Panel de Datos Clínicos</title>
  <style>
    :root {
      --primary: #0f62fe;
      --primary-dark: #0043ce;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --text: #161b26;
      --muted: #5f6c80;
      --border: #dfe5ef;
      --success-bg: #defbe6;
      --success-text: #0e6027;
      --info-bg: #edf5ff;
      --info-text: #0043ce;
      --warn-bg: #fff1d6;
      --warn-text: #8a5300;
      --danger-bg: #ffd7d9;
      --danger-text: #a2191f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Barra superior */
    .topbar {
      background: linear-gradient(135deg, #0043ce 0%, #0f62fe 100%);
      color: #ffffff;
      padding: 1.25rem 2rem;
      box-shadow: 0 4px 14px rgba(15, 98, 254, 0.18);
    }

    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .brand p {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .btn-refresh {
      background: #ffffff;
      color: var(--primary-dark);
      border: none;
      padding: 0.6rem 1.15rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-refresh:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    /* Contenedor principal */
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* Tarjetas de resumen */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      box-shadow: 0 2px 6px rgba(16, 24, 40, 0.04);
    }

    .stat-card span {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .stat-card strong {
      font-size: 1.85rem;
      color: var(--primary-dark);
    }

    /* Navegación por pestañas y buscador */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.6rem 1.15rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .search-box {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .search-box input,
    .search-box select {
      padding: 0.6rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus,
    .search-box select:focus {
      border-color: var(--primary);
    }

    /* Panel de tabla */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(16, 24, 40, 0.05);
      overflow: hidden;
    }

    .panel-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .panel-header h2 {
      font-size: 1.1rem;
    }

    .endpoint-pill {
      font-size: 0.78rem;
      background: var(--info-bg);
      color: var(--info-text);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.92rem;
    }

    thead {
      background: #f8fafd;
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 0.9rem 1.25rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    td {
      padding: 0.95rem 1.25rem;
      border-bottom: 1px solid #eef2f7;
    }

    tbody tr:hover {
      background-color: #f8fbff;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge-programada, .badge-info {
      background: var(--info-bg);
      color: var(--info-text);
    }

    .badge-confirmada, .badge-atendida, .badge-activa {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .badge-medio {
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    .badge-cancelada, .badge-incumplida, .badge-alto, .badge-inactiva {
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .empty-msg {
      text-align: center;
      padding: 2.5rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-icon">+</div>
        <div>
          <h1>Medik — Monitor de Registros Clínicos</h1>
          <p>Visualización organizada en tiempo real de citas, médicos y pacientes</p>
        </div>
      </div>
      <button class="btn-refresh" onclick="cargarTodo()">Actualizar Datos</button>
    </div>
  </header>

  <main class="container">
    <!-- Resumen numérico -->
    <section class="stats-grid">
      <div class="stat-card">
        <span>Total de Citas</span>
        <strong id="count-citas">0</strong>
      </div>
      <div class="stat-card">
        <span>Médicos Activos</span>
        <strong id="count-medicos">0</strong>
      </div>
      <div class="stat-card">
        <span>Pacientes Registrados</span>
        <strong id="count-pacientes">0</strong>
      </div>
      <div class="stat-card">
        <span>Especialidades</span>
        <strong id="count-especialidades">0</strong>
      </div>
    </section>

    <!-- Pestañas y filtros -->
    <section class="toolbar">
      <div class="tabs">
        <button class="tab-btn active" onclick="cambiarTab('citas', this)">Citas Médicas</button>
        <button class="tab-btn" onclick="cambiarTab('medicos', this)">Médicos</button>
        <button class="tab-btn" onclick="cambiarTab('pacientes', this)">Pacientes</button>
        <button class="tab-btn" onclick="cambiarTab('especialidades', this)">Especialidades</button>
      </div>

      <div class="search-box">
        <input type="text" id="buscador" placeholder="Buscar por nombre, documento o especialidad..." oninput="renderizarTabla()" />
        <select id="filtro-estado" onchange="renderizarTabla()">
          <option value="">Todos los estados</option>
          <option value="Programada">Programada</option>
          <option value="Confirmada">Confirmada</option>
          <option value="Atendida">Atendida</option>
          <option value="Cancelada">Cancelada</option>
          <option value="Incumplida">Incumplida</option>
        </select>
      </div>
    </section>

    <!-- Tabla dinámica -->
    <section class="panel">
      <div class="panel-header">
        <h2 id="tabla-titulo">Listado General de Citas</h2>
        <span class="endpoint-pill" id="tabla-origen">Datos en vivo</span>
      </div>
      <div class="table-wrap" id="tabla-contenedor">
        <p class="empty-msg">Cargando información...</p>
      </div>
    </section>
  </main>

  <script>
    let tabActual = 'citas';
    let datos = { citas: [], medicos: [], pacientes: [], especialidades: [] };

    async function cargarTodo() {
      try {
        const [citas, medicos, pacientes, especialidades] = await Promise.all([
          fetch('/api/citas').then(r => r.json()),
          fetch('/api/medicos').then(r => r.json()),
          fetch('/api/pacientes').then(r => r.json()),
          fetch('/api/especialidades').then(r => r.json())
        ]);

        datos = { citas, medicos, pacientes, especialidades };

        document.getElementById('count-citas').textContent = citas.length;
        document.getElementById('count-medicos').textContent = medicos.length;
        document.getElementById('count-pacientes').textContent = pacientes.length;
        document.getElementById('count-especialidades').textContent = especialidades.length;

        renderizarTabla();
      } catch (error) {
        document.getElementById('tabla-contenedor').innerHTML =
          '<p class="empty-msg">No se pudieron cargar los datos. Verifica que el servidor esté encendido.</p>';
      }
    }

    function cambiarTab(tab, boton) {
      tabActual = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      boton.classList.add('active');
      document.getElementById('filtro-estado').style.display = tab === 'citas' ? 'inline-block' : 'none';
      renderizarTabla();
    }

    function renderizarTabla() {
      const texto = document.getElementById('buscador').value.toLowerCase().trim();
      const estadoFiltro = document.getElementById('filtro-estado').value;
      const contenedor = document.getElementById('tabla-contenedor');
      const titulo = document.getElementById('tabla-titulo');
      const origen = document.getElementById('tabla-origen');

      if (tabActual === 'citas') {
        titulo.textContent = 'Listado General de Citas';
        origen.textContent = '/api/citas';
        const filtradas = datos.citas.filter(c => {
          const coincideTexto = !texto ||
            (c.nombrePaciente || '').toLowerCase().includes(texto) ||
            (c.documentoPaciente || '').includes(texto) ||
            (c.nombreMedico || '').toLowerCase().includes(texto) ||
            (c.especialidad || '').toLowerCase().includes(texto);
          const coincideEstado = !estadoFiltro || c.estado === estadoFiltro;
          return coincideTexto && coincideEstado;
        });

        if (filtradas.length === 0) {
          contenedor.innerHTML = '<p class="empty-msg">No hay citas que coincidan con el filtro.</p>';
          return;
        }

        contenedor.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Código</th>
                <th>Paciente</th>
                <th>Doc. Paciente</th>
                <th>Médico</th>
                <th>Especialidad</th>
                <th>Fecha</th>
                <th>Hora</th>
                <th>Estado</th>
                <th>Motivo</th>
              </tr>
            </thead>
            <tbody>
              ${filtradas.map(c => `
                <tr>
                  <td><strong>#${c.id || '-'}</strong></td>
                  <td>${c.nombrePaciente}</td>
                  <td>${c.documentoPaciente || '-'}</td>
                  <td>${c.nombreMedico}</td>
                  <td>${c.especialidad || 'General'}</td>
                  <td>${c.fecha}</td>
                  <td><strong>${c.hora}</strong></td>
                  <td><span class="badge badge-${(c.estado || '').toLowerCase()}">${c.estado}</span></td>
                  <td>${c.motivo || 'Consulta médica general'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>`;
      }

      if (tabActual === 'medicos') {
        titulo.textContent = 'Directorio de Médicos';
        origen.textContent = '/api/medicos';
        const filtrados = datos.medicos.filter(m =>
          !texto ||
          (m.nombre || '').toLowerCase().includes(texto) ||
          (m.documento || '').includes(texto) ||
          (m.especialidad || '').toLowerCase().includes(texto)
        );

        if (filtrados.length === 0) {
          contenedor.innerHTML = '<p class="empty-msg">No se encontraron médicos.</p>';
          return;
        }

        contenedor.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Nombre del Médico</th>
                <th>Documento</th>
                <th>Especialidad</th>
                <th>Consultorio</th>
              </tr>
            </thead>
            <tbody>
              ${filtrados.map(m => `
                <tr>
                  <td><strong>${m.nombre}</strong></td>
                  <td>${m.documento}</td>
                  <td><span class="badge badge-info">${m.especialidad}</span></td>
                  <td>${m.consultorio || 'Consultorio General'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>`;
      }

      if (tabActual === 'pacientes') {
        titulo.textContent = 'Registro de Pacientes';
        origen.textContent = '/api/pacientes';
        const filtrados = datos.pacientes.filter(p =>
          !texto ||
          (p.nombre || '').toLowerCase().includes(texto) ||
          (p.documento || '').includes(texto)
        );

        if (filtrados.length === 0) {
          contenedor.innerHTML = '<p class="empty-msg">No se encontraron pacientes.</p>';
          return;
        }

        contenedor.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Nombre Completo</th>
                <th>Documento</th>
                <th>Edad</th>
                <th>Nivel de Riesgo</th>
                <th>Incumplidas</th>
                <th>Seguimiento</th>
              </tr>
            </thead>
            <tbody>
              ${filtrados.map(p => `
                <tr>
                  <td><strong>${p.nombre}</strong></td>
                  <td>${p.documento}</td>
                  <td>${p.edad} años</td>
                  <td><span class="badge badge-${(p.nivelRiesgo || 'bajo').toLowerCase()}">${p.nivelRiesgo || 'Bajo'}</span></td>
                  <td>${p.citasIncumplidas ?? 0}</td>
                  <td>${p.necesitaSeguimiento ? 'Requiere seguimiento' : 'Normal'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>`;
      }

      if (tabActual === 'especialidades') {
        titulo.textContent = 'Especialidades de la Clínica';
        origen.textContent = '/api/especialidades';
        const filtradas = datos.especialidades.filter(e =>
          !texto || (e.nombre || '').toLowerCase().includes(texto)
        );

        if (filtradas.length === 0) {
          contenedor.innerHTML = '<p class="empty-msg">No hay especialidades registradas.</p>';
          return;
        }

        contenedor.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Especialidad</th>
                <th>Descripción</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody>
              ${filtradas.map(e => `
                <tr>
                  <td><strong>${e.nombre}</strong></td>
                  <td>${e.descripcion || '-'}</td>
                  <td><span class="badge ${e.activa ? 'badge-activa' : 'badge-inactiva'}">${e.activa ? 'Activa' : 'Inactiva'}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>`;
      }
    }

    cargarTodo();
  </script>
</body>
</html>
